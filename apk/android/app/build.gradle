apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'kotlin-kapt'

kapt {
    arguments { arg('room.schemaLocation', "$projectDir/schemas") }
}

android {
    namespace = "com.kebiao.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kebiao.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        compose true
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    signingConfigs {
        release {
            if (System.getenv('CLASS_SCHEDULE_KEYSTORE')) {
                storeFile file(System.getenv('CLASS_SCHEDULE_KEYSTORE'))
                storePassword System.getenv('CLASS_SCHEDULE_STORE_PASSWORD')
                keyAlias System.getenv('CLASS_SCHEDULE_KEY_ALIAS')
                keyPassword System.getenv('CLASS_SCHEDULE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('CLASS_SCHEDULE_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Include the project's license and third-party notices in every installable build.
def legalAssets = layout.buildDirectory.dir('generated/legalAssets')
tasks.register('generateLegalAssets', Sync) {
    into legalAssets.map { it.dir('licenses') }
    from(rootProject.file('../../LICENSE'))
    from(rootProject.file('../../NOTICE'))
    from(rootProject.file('../../THIRD_PARTY_NOTICES.md'))
    from(rootProject.file('../../licenses'))
}
android.sourceSets.main.assets.srcDir(legalAssets)
tasks.named('preBuild').configure { dependsOn('generateLegalAssets') }

// Machine-local paths are exported only to ignored build output for notice generation.
tasks.register('exportRuntimeInventory') {
    doLast {
        def artifacts = configurations.releaseRuntimeClasspath.incoming.artifactView {
            componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
        }.artifacts.artifacts.collect {
            [coordinate: it.id.componentIdentifier.displayName, file: it.file.absolutePath]
        }.sort { it.coordinate }
        def output = layout.buildDirectory.file('reports/runtime-inventory.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(artifacts))
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'androidx.glance:glance-appwidget:1.1.1'
    implementation 'androidx.glance:glance-material3:1.1.1'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation "androidx.room:room-runtime:2.7.2"
    implementation "androidx.room:room-ktx:2.7.2"
    kapt "androidx.room:room-compiler:2.7.2"
    kapt 'org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.0'
    implementation "androidx.datastore:datastore-preferences:1.1.7"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation 'io.modelcontextprotocol:kotlin-sdk-server:0.15.0'
    implementation 'io.ktor:ktor-server-cio:3.5.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.21.1'
    implementation 'org.opencv:opencv:4.12.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    coreLibraryDesugaring libs.android.tools.desugar
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.4.0'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:2.4.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation platform('androidx.compose:compose-bom:2025.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
