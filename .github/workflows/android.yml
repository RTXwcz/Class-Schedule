name: Android and Web checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: node --test tests/*.test.cjs
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon
        working-directory: apk/android
      # Release-only rules (R8, resource shrinking) are not exercised by the debug variant.
      - run: bash gradlew :app:assembleRelease :app:lintRelease --no-daemon
        working-directory: apk/android
        env:
          CLASS_SCHEDULE_ALLOW_UNSIGNED: "1"
